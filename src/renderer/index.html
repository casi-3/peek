<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="card" class="hidden">
      <div id="timer-bar"></div>
      <div id="video"><canvas id="bbox-canvas"></canvas><img id="poster" alt="" /></div>
      <div id="grid" class="hidden"></div>
      <div id="top">
        <span id="cam"></span>
        <button id="close" aria-label="close">✕</button>
      </div>
      <div id="bottom">
        <div id="detections"></div>
        <div id="info"></div>
      </div>
    </div>
    <div id="placement" class="hidden">
      <p id="placement-text">Drag this window where you want it, then lock it in place.</p>
      <div id="placement-actions">
        <button id="placement-lock">Lock here</button>
        <button id="placement-cancel">Cancel</button>
      </div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
